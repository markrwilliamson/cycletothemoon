<style>
  :root{
    --bg:#faf6ee; --panel:#fffdf8; --ink:#241f18; --muted:#7d7365;
    --line:#e7ddc9; --amber:#e9a92c; --amber-soft:#fbeccb; --amber-deep:#c07d10;
    --slate:#4a6fa5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161310; --panel:#211d18; --ink:#f3ece0; --muted:#a2978a;
      --line:#3a3229; --amber:#f0b640; --amber-soft:#3a2f18; --amber-deep:#f5cd76;
      --slate:#8fb0e0;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px}
  header{text-align:center;margin:6px 0 26px}
  .mark{width:min(430px,82%);height:auto;display:block;margin:0 auto}
  @media (prefers-color-scheme:dark){ .mark{filter:invert(1)} }
  .challenge{font-size:12.5px;letter-spacing:.34em;text-transform:uppercase;
             font-weight:600;color:var(--amber-deep);margin-top:2px}
  .byline{font-size:15px;color:var(--ink);margin-top:10px;font-weight:500}
  .stamp{font-size:12.5px;color:var(--muted);margin-top:4px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);
      white-space:nowrap}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;
         padding:22px;margin-bottom:18px}

  .hero{text-align:center;padding:30px 22px 26px}
  .pct{font-size:64px;font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--amber-deep)}
  .pct span{font-size:30px;font-weight:600}
  .hero .sub{color:var(--muted);font-size:14.5px;margin-top:8px}

  .track{position:relative;height:14px;border-radius:99px;background:var(--amber-soft);
         margin:26px 0 10px;overflow:visible}
  .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;
        background:linear-gradient(90deg,var(--amber),var(--amber-deep))}
  .moon{position:absolute;top:-9px;right:-6px;font-size:22px;line-height:1}
  .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
        background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .cell{background:var(--panel);padding:16px 18px}
  .cell .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .cell .v{font-size:25px;font-weight:650;margin-top:3px;letter-spacing:-.02em;
           white-space:nowrap;font-variant-numeric:tabular-nums}
  .cell .v small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}

  h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
     margin:0 0 16px;font-weight:600}
  .arrive{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
  .arrive .big{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em}
  .arrive .lbl{font-size:12.5px;color:var(--muted);margin-top:6px}
  .bands{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
         font-size:13.5px;color:var(--muted)}
  .bands b{color:var(--ink);font-weight:600}

  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  svg{display:block}
  .note{font-size:13px;color:var(--muted);margin-top:14px}
  footer{font-size:12.5px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.7}
  .warn{background:#fdecec;border-color:#f3c9c9;color:#8a2020}
  @media (prefers-color-scheme: dark){ .warn{background:#3a1f1f;border-color:#5c2f2f;color:#f0b4b4} }
</style>
</head>

  return '<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+g+'" stroke-width="1"/>';
}
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

 
(function(){
  var d = M.years; if(!d.length) return;
  var colW = 52, padL = 46, padR = 14, padT = 26, padB = 34;
  var w = padL + padR + colW * d.length, h = 300;
  var plotH = h - padT - padB;
  var max = Math.max.apply(null, d.map(function(r){return r.km;})) * 1.15 || 1;
  var line = css('--line'), muted = css('--muted'), amber = css('--amber'), ink = css('--ink');

  var s = '';
  
  var ticks = 4;
  for (var i=0;i<=ticks;i++){
    var val = max/ticks*i, y = padT + plotH - (val/max)*plotH;
    s += '<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="'+line+'" stroke-width="1"/>';
    s += '<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" fill="'+muted+'">'+
         (val>=1000? Math.round(val/1000)+'k' : Math.round(val))+'</text>';
  }
  d.forEach(function(r,i){
    var bh = (r.km/max)*plotH;
    var x = padL + i*colW + 9, bw = colW - 18;
    var y = padT + plotH - bh;
    s += '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+amber+'"><title>'+
         r.year+': '+fmt(r.km,0)+' km, '+r.rides+' rides</title></rect>';
    s += '<text x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="'+ink+'">'+
         (r.km>=1000? (r.km/1000).toFixed(1)+'k' : r.km)+'</text>';
    s += '<text x="'+(x+bw/2)+'" y="'+(h-padB+16)+'" text-anchor="middle" font-size="10.5" fill="'+muted+'">'+
         String(r.year).slice(2)+'</text>';
  });
  s += axis(line, padL, w-padR, padT+plotH);
  var svg = document.getElementById('yearChart');
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.setAttribute('viewBox','0 0 '+w+' '+h); svg.innerHTML = s;

  var best = d.reduce(function(a,b){ return b.km>a.km?b:a; });
  document.getElementById('yearNote').textContent =
    'Best year: ' + best.year + ' at ' + fmt(best.km,0) + ' km. ' +
    'The current year is still in progress.';
})();

 
(function(){
  var d = M.years; if(!d.length) return;

  var now = new Date();
  var nowT = now.getFullYear() +
             (now - new Date(now.getFullYear(),0,1)) / (365.25*86400000);

  function rateFor(a){
    var r = M.bands.length ? M.bands[0].rate : 0;
    for (var i=0;i<M.bands.length;i++) if (a >= M.bands[i].age) r = M.bands[i].rate;
    return r;
  }

   
  var actual = [{t: d[0].year, v: 0}], c = 0;
  d.forEach(function(r,i){
    c += r.km;
    actual.push({ t: (i === d.length-1) ? nowT : r.year + 1, v: c });
  });

   
  var proj = [{t: nowT, v: M.total}];
  var a = M.age, t = nowT, v = M.total, guard = 0;
  while (v < M.target && guard++ < 120){
    var nextT = Math.floor(t) + 1, dt = nextT - t, r = rateFor(a);
    if (r <= 0) break;
    if (v + r*dt >= M.target){ proj.push({t: t + (M.target-v)/r, v: M.target}); v = M.target; break; }
    v += r*dt; a += dt; t = nextT;
    proj.push({t: t, v: v});
  }

  var t0 = actual[0].t;
  var t1 = Math.ceil(proj[proj.length-1].t);
  var padL = 54, padR = 20, padT = 34, padB = 44;
  var w = Math.max(620, padL + padR + (t1-t0) * 17), h = 300;
  var plotW = w-padL-padR, plotH = h-padT-padB;
  var line=css('--line'), muted=css('--muted'), slate=css('--slate'),
      amber=css('--amber'), deep=css('--amber-deep'), ink=css('--ink');

  var X = function(tt){ return padL + (tt-t0)/(t1-t0)*plotW; };
  var Y = function(vv){ return padT + plotH - (vv/M.target)*plotH; };
  var path = function(pts){ return 'M' + pts.map(function(p){return X(p.t)+','+Y(p.v);}).join(' L'); };

  var s = '';

   
  [0,.25,.5,.75,1].forEach(function(f){
    var y = Y(f*M.target);
    s += '<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="'+line+'" stroke-width="1"'+
         (f===1?' stroke-dasharray="4 3"':'')+'/>';
    s += '<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" fill="'+muted+'">'+
         Math.round(f*100)+'%</text>';
  });
  s += '<text x="'+(padL+6)+'" y="'+(Y(M.target)-7)+'" font-size="10.5" '+
       'font-weight="600" fill="'+muted+'">the moon</text>';

   
  M.bands.forEach(function(b,i){
    if (i===0) return;
    var tt = nowT + (b.age - M.age);
    if (tt <= nowT || tt >= t1) return;
    s += '<line x1="'+X(tt)+'" y1="'+padT+'" x2="'+X(tt)+'" y2="'+(padT+plotH)+
         '" stroke="'+line+'" stroke-width="1" stroke-dasharray="2 4"/>';
    s += '<text x="'+X(tt)+'" y="'+(padT-8)+'" text-anchor="middle" font-size="9.5" fill="'+muted+'">'+
         b.age+'</text>';
  });

   
  s += '<path d="'+path(actual)+' L'+X(nowT)+','+Y(0)+' L'+X(t0)+','+Y(0)+' Z" fill="'+amber+'" opacity="0.16"/>';
  s += '<path d="'+path(actual)+'" fill="none" stroke="'+deep+'" stroke-width="2.6" stroke-linejoin="round"/>';

   
  s += '<path d="'+path(proj)+'" fill="none" stroke="'+slate+'" stroke-width="2.2" '+
       'stroke-dasharray="6 4" stroke-linejoin="round"/>';

   
  s += '<line x1="'+X(nowT)+'" y1="'+Y(M.total)+'" x2="'+X(nowT)+'" y2="'+(padT+plotH)+
       '" stroke="'+muted+'" stroke-width="1" stroke-dasharray="2 3"/>';
  s += '<circle cx="'+X(nowT)+'" cy="'+Y(M.total)+'" r="5" fill="'+amber+'" stroke="'+deep+'" stroke-width="2"/>';
  s += '<text x="'+(X(nowT)+9)+'" y="'+(Y(M.total)-9)+'" font-size="11" font-weight="600" fill="'+ink+'">'+
       fmt(M.pct,1)+'% today</text>';

   
  var end = proj[proj.length-1];
  if (end.v >= M.target){
    s += '<circle cx="'+X(end.t)+'" cy="'+Y(end.v)+'" r="4.5" fill="'+slate+'"/>';
    s += '<text x="'+(X(end.t)-7)+'" y="'+(Y(end.v)+18)+'" text-anchor="end" font-size="11.5" '+
         'font-weight="600" fill="'+slate+'">'+Math.round(end.t)+'</text>';
  }

   
  for (var yr = Math.ceil(t0/5)*5; yr <= t1; yr += 5){
    s += '<text x="'+X(yr)+'" y="'+(h-padB+18)+'" text-anchor="middle" font-size="10.5" fill="'+muted+'">'+
         yr+'</text>';
  }
  s += '<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(w-padR)+'" y2="'+(padT+plotH)+
       '" stroke="'+line+'" stroke-width="1"/>';

   
  s += '<line x1="'+padL+'" y1="'+(h-14)+'" x2="'+(padL+22)+'" y2="'+(h-14)+'" stroke="'+deep+'" stroke-width="2.6"/>';
  s += '<text x="'+(padL+28)+'" y="'+(h-10)+'" font-size="10.5" fill="'+muted+'">ridden</text>';
  s += '<line x1="'+(padL+92)+'" y1="'+(h-14)+'" x2="'+(padL+114)+'" y2="'+(h-14)+'" stroke="'+slate+
       '" stroke-width="2.2" stroke-dasharray="6 4"/>';
  s += '<text x="'+(padL+120)+'" y="'+(h-10)+'" font-size="10.5" fill="'+muted+'">projected</text>';
  s += '<text x="'+(padL+205)+'" y="'+(h-10)+'" font-size="10.5" fill="'+muted+
       '">dotted verticals mark the age the pace steps down</text>';

  var svg = document.getElementById('cumChart');
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.setAttribute('viewBox','0 0 '+w+' '+h); svg.innerHTML = s;

  document.getElementById('cumNote').textContent = M.bands.length < 2 ? '' :
    'Age-tapered model, assuming current ' + fmt(M.bands[0].rate,0) + ' km/yr tapers to ' +
    M.bands.slice(1).map(function(b){ return fmt(b.rate,0)+' km/yr from age '+b.age; }).join(', ') + '.';
})();

 
(function(){
  var p = document.getElementById('syncPanel'), l = document.getElementById('syncLine');
  if (!M.lastSync){ p.className='panel warn'; l.textContent='No successful sync recorded yet.'; return; }
  if (M.lastSync.daysAgo > 7){
    p.className='panel warn';
    l.textContent='Sync warning: last successful update was '+M.lastSync.when+', '+M.lastSync.daysAgo+' days ago.';
  } else {
    l.innerHTML = 'Synced from Strava '+M.lastSync.when+'.' +
      (M.lastRide? ' Last ride: <b>'+M.lastRide.name+'</b>, '+fmt(M.lastRide.km,1)+' km on '+M.lastRide.date+'.' : '');
  }
})();

document.getElementById('foot').innerHTML =
  fmt(M.remaining,0)+' km still to ride.<br>Data from Strava, updated daily.';
</script>
</body>
</html>
